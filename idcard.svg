<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 700" width="100%" height="100%">
  <defs>
    <!-- Card Outer & Inner Shadows -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="photo-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8f9fa" />
    </linearGradient>

    <!-- Top Right Abstract Wave/Blob Gradient -->
    <linearGradient id="blob-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="50%" stop-color="#e91e63" />
      <stop offset="100%" stop-color="#00bcd4" />
    </linearGradient>
    <linearGradient id="blob-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#00bcd4" />
    </linearGradient>

    <!-- Photo Circle Backdrop Gradient -->
    <linearGradient id="photo-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>

    <!-- Green Banner Gradient -->
    <linearGradient id="green-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="50%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
  </defs>

  <!-- Lanyard / Background Canvas Space -->
  <rect width="100%" height="100%" fill="#1a1c23" />

  <!-- ID CARD CONTAINER -->
  <g transform="translate(50, 35)">
    <!-- Card Plastic Pouch / Holder Outline -->
    <rect x="-14" y="-20" width="378" height="660" rx="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
    
    <!-- Lanyard Slot at Top -->
    <path d="M 125,-20 C 125,-28 135,-32 150,-32 C 165,-32 175,-28 175,-20 Z" fill="#1a1c23" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

    <!-- Main White Card Body -->
    <rect x="0" y="0" width="350" height="620" rx="16" fill="url(#bg-grad)" filter="url(#card-shadow)" stroke="#e0e0e0" stroke-width="1" />

    <!-- TOP DECORATIVE GRAPHICS (Abstract Waves / Color Accents) -->
    <path d="M 200,0 Q 280,30 350,80 L 350,0 Z" fill="url(#blob-grad-1)" opacity="0.85" />
    <path d="M 280,0 Q 320,50 350,130 L 350,0 Z" fill="url(#blob-grad-2)" opacity="0.4" />
    <circle cx="320" cy="270" r="22" fill="#81c784" opacity="0.35" />

    <!-- COLLEGE LOGO & BRANDING -->
    <g transform="translate(26, 30)">
      <!-- College Name Text -->
      <text x="0" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="18" fill="#212121" letter-spacing="0.5">CHENNAI</text>
      <text x="0" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#424242" letter-spacing="0.8">INSTITUTE OF</text>
      <text x="0" y="66" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="19" fill="#1a237e" letter-spacing="0.5">TECHNOLOGY</text>

      <!-- Green Tagline Banner -->
      <g transform="translate(0, 75)">
        <rect x="0" y="0" width="138" height="18" rx="3" fill="url(#green-banner)" />
        <text x="69" y="13" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="10.5" fill="#ffffff" text-anchor="middle">Transforming Lives</text>
      </g>
    </g>

    <!-- STUDENT PHOTO FRAME & NORMAL DEFAULT ICON -->
    <g transform="translate(100, 140)" filter="url(#photo-shadow)">
      <!-- Outer Cyan Ring -->
      <circle cx="75" cy="75" r="77" fill="none" stroke="#b3e5fc" stroke-width="3" />
      <!-- Background Gradient Circle -->
      <circle cx="75" cy="75" r="75" fill="url(#photo-bg)" />
      
      <!-- Normal Default User / Common Man Icon -->
      <g transform="translate(75, 78)">
        <!-- Body / Shirt -->
        <path d="M -45,70 C -45,46 -26,38 0,38 C 26,38 45,46 45,70 Z" fill="#ffffff" />
        <!-- Collar -->
        <path d="M -12,38 L 0,52 L 12,38 L 6,38 L 0,46 L -6,38 Z" fill="#cfd8dc" />
        <!-- Neck -->
        <rect x="-9" y="22" width="18" height="20" fill="#d7ccc8" rx="3" />
        <!-- Head / Face -->
        <circle cx="0" cy="0" r="28" fill="#d7ccc8" />
        <!-- Hair -->
        <path d="M -27,-5 C -28,-22 -12,-30 0,-30 C 14,-30 27,-22 28,-5 Z" fill="#37474f" />
        <!-- Eyes -->
        <circle cx="-9" cy="-2" r="2.5" fill="#37474f" />
        <circle cx="9" cy="-2" r="2.5" fill="#37474f" />
        <!-- Smile -->
        <path d="M -6,8 Q 0,14 6,8" fill="none" stroke="#8d6e63" stroke-width="1.8" stroke-linecap="round" />
      </g>
    </g>

    <!-- STUDENT DETAILS (Generic Placeholders: Name, Dept, Batch) -->
    <g transform="translate(175, 335)" text-anchor="middle">
      <text x="0" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="24" fill="#212121" letter-spacing="1.2">NAME</text>
      <text x="0" y="32" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="18" fill="#424242" letter-spacing="0.8">DEP</text>
      <text x="0" y="65" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#263238" letter-spacing="1">BATCH</text>
    </g>

    <!-- Card Hologram / Security Badge Effect (Bottom Center Subtle Touch) -->
    <g transform="translate(165, 545)" opacity="0.4">
      <circle cx="10" cy="10" r="10" fill="url(#blob-grad-1)" />
      <circle cx="10" cy="10" r="6" fill="#ffffff" />
      <circle cx="10" cy="10" r="3" fill="url(#blob-grad-2)" />
    </g>
  </g>
</svg>
